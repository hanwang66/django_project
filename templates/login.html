<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 32px; }
        label { display: block; margin: 16px 0 6px; color: #2980b9; }
        input { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 16px; }
        input[type="submit"] { background: #2980b9; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #3498db; }
        .msg { color: #e74c3c; text-align: center; margin-bottom: 16px; }
        a { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>用户登录</h1>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="msg">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}
        <form method="post">
            <label for="username">用户名：</label>
            <input type="text" name="username" id="username" required>
            <label for="password">密码：</label>
            <input type="password" name="password" id="password" required>
            <input type="submit" value="登录">
        </form>
        <p><a href="/register">没有账号？注册</a></p>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
