{% extends 'base/base.html' %}
{% block title %}个人中心{% endblock %}
{% block content %}
<div style="max-width:700px;margin:40px auto;background:#fff;border-radius:16px;box-shadow:0 4px 24px #e3f2fd;padding:48px 56px;">
    <h2 style="text-align:center;color:#1976d2;font-weight:800;margin-bottom:36px;font-size:2em;letter-spacing:2px;">个人中心</h2>
    <div style="display:flex;align-items:flex-start;gap:40px;">
        <div style="flex:0 0 120px;text-align:center;">
            {% if profile.avatar %}
                <img src="{{ profile.avatar.url }}" alt="头像" style="width:110px;height:110px;border-radius:50%;object-fit:cover;box-shadow:0 2px 12px #eee;">
            {% else %}
                <div style="width:110px;height:110px;border-radius:50%;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-size:3em;color:#1976d2;box-shadow:0 2px 12px #eee;">{{ user.username|slice:':1'|upper }}</div>
            {% endif %}
            <div style="margin-top:18px;">
                <form method="post" enctype="multipart/form-data" style="display:inline;">
                    {% csrf_token %}
                    <input type="file" name="avatar" accept="image/*" style="margin-bottom:8px;">
                    <button type="submit" name="change_avatar" style="background:#388e3c;color:#fff;padding:6px 18px;border:none;border-radius:6px;font-weight:600;">更换头像</button>
                </form>
            </div>
        </div>
        <div style="flex:1;">
            <form method="post" style="display:flex;flex-direction:column;gap:22px;">
                {% csrf_token %}
                <div>
                    <label style="font-weight:bold;color:#1976d2;">用户名：</label>
                    <input type="text" value="{{ user.username }}" readonly style="background:#f5f5f5;color:#888;border:none;padding:8px 16px;border-radius:6px;font-size:1.1em;">
                </div>
                <div>
                    <label style="font-weight:bold;color:#1976d2;">昵称：</label>
                    <input type="text" name="nickname" value="{{ profile.nickname }}" maxlength="30" style="padding:8px 16px;border-radius:6px;border:1px solid #ccc;font-size:1.1em;">
                </div>
                <div>
                    <label style="font-weight:bold;color:#1976d2;">邮箱：</label>
                    <input type="email" name="email" value="{{ user.email }}" maxlength="50" style="padding:8px 16px;border-radius:6px;border:1px solid #ccc;font-size:1.1em;">
                </div>
                <div>
                    <label style="font-weight:bold;color:#1976d2;">简介：</label>
                    <textarea name="bio" rows="4" style="width:100%;padding:10px 16px;border-radius:6px;border:1px solid #ccc;font-size:1.1em;">{{ profile.bio }}</textarea>
                </div>
                <button type="submit" style="background:#1976d2;color:#fff;padding:12px 0;border:none;border-radius:8px;font-size:1.2em;font-weight:700;margin-top:8px;box-shadow:0 2px 8px #e3f2fd;">保存修改</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
