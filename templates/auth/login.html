<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>登录</title>
	<link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background:#f6f8fa;">
<div class="auth-form-container" style="max-width:480px;margin:80px auto 0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 16px #e0e0e0;padding:48px 36px;">
	<h2 style="text-align:center;margin-bottom:24px;">用户登录</h2>
	{% if error %}
		<div style="color:#d32f2f;background:#fff3e0;padding:10px 18px;border-radius:6px;margin-bottom:18px;text-align:center;">{{ error }}</div>
	{% endif %}
	<form method="post" style="display:flex;flex-direction:column;gap:18px;">
		{% csrf_token %}
		<div>
			<label for="username">用户名</label>
			<input type="text" id="username" name="username" class="form-control" required autofocus>
		</div>
		<div>
			<label for="password">密码</label>
			<input type="password" id="password" name="password" class="form-control" required>
		</div>
		<button type="submit" class="btn btn-primary" style="width:100%;padding:10px 0;font-size:1.1em;">登录</button>
	</form>
	<div style="text-align:center;margin-top:18px;">
		还没有账号？<a href="/auth/register/" style="color:#1976d2;">立即注册</a>
	</div>
</div>
</body>
</html>
