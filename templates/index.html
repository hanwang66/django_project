{% extends 'base/base.html' %}
{% block title %}信息管理平台首页{% endblock %}
{% block content %}
<h1 style="text-align:center;color:#2c3e50;margin-bottom:16px;">信息管理平台</h1>
<div style="display:flex;justify-content:center;gap:48px;margin-bottom:36px;">
  <a href="/blog/" style="text-decoration:none;">
    <div style="background:#e3f2fd;border-radius:16px;box-shadow:0 2px 12px #bbdefb;padding:32px 48px;min-width:220px;display:flex;flex-direction:column;align-items:center;transition:box-shadow 0.2s;cursor:pointer;">
      <span style="font-size:2.2em;">📝</span>
      <div style="font-size:1.3em;font-weight:700;color:#1976d2;margin-top:8px;">博客数量</div>
      <div style="font-size:2em;font-weight:800;color:#222;margin-top:8px;">{{ blog_count }}</div>
    </div>
  </a>
  <a href="/real_estate/" style="text-decoration:none;">
    <div style="background:#e8f5e9;border-radius:16px;box-shadow:0 2px 12px #c8e6c9;padding:32px 48px;min-width:220px;display:flex;flex-direction:column;align-items:center;transition:box-shadow 0.2s;cursor:pointer;">
      <span style="font-size:2.2em;">🏢</span>
      <div style="font-size:1.3em;font-weight:700;color:#388e3c;margin-top:8px;">房产条目</div>
      <div style="font-size:2em;font-weight:800;color:#222;margin-top:8px;">{{ realestate_count }}</div>
    </div>
  </a>
  <a href="/stock/" style="text-decoration:none;">
    <div style="background:#fff3e0;border-radius:16px;box-shadow:0 2px 12px #ffe0b2;padding:32px 48px;min-width:220px;display:flex;flex-direction:column;align-items:center;transition:box-shadow 0.2s;cursor:pointer;">
      <span style="font-size:2.2em;">💹</span>
      <div style="font-size:1.3em;font-weight:700;color:#e65100;margin-top:8px;">股票行情</div>
      <div style="font-size:2em;font-weight:800;color:#222;margin-top:8px;">{{ stock_count }}</div>
    </div>
  </a>
</div>
{% endblock %}
