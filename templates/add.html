<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>录入新信息</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 32px; }
        label { display: block; margin: 16px 0 6px; color: #2980b9; }
        input, textarea { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 16px; }
        input[type="submit"] { background: #2980b9; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #3498db; }
        a { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>录入新信息</h1>
        <form method="post">
            <label for="name">姓名：</label>
            <input type="text" name="name" id="name" required>
            <label for="email">邮箱：</label>
            <input type="email" name="email" id="email" required>
            <label for="message">信息：</label>
            <textarea name="message" id="message"></textarea>
            <input type="submit" value="提交">
        </form>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
