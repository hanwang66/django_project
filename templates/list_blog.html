<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>博客列表</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 32px; }
        .blog-card { background: #f9fafc; border-radius: 10px; box-shadow: 0 1px 4px #e0e0e0; padding: 24px; margin-bottom: 24px; }
        .blog-title { font-size: 22px; color: #2980b9; margin-bottom: 8px; }
        .blog-meta { color: #888; font-size: 14px; margin-bottom: 12px; }
        .blog-content { color: #333; font-size: 16px; margin-bottom: 8px; }
        a { color: #2980b9; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .add-btn { display: inline-block; background: #2980b9; color: #fff; padding: 8px 20px; border-radius: 5px; margin-bottom: 24px; text-align: center; }
        .add-btn:hover { background: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <h1>博客列表</h1>
        <a class="add-btn" href="/blog/add">发布新博客</a>
        {% for blog in blogs %}
        <div class="blog-card">
            <div class="blog-title"><a href="/blog/{{ blog[0] }}">{{ blog[1] }}</a></div>
            <div class="blog-meta">作者：{{ blog[2] }}</div>
            <div class="blog-content">{{ blog[3][:120] }}{% if blog[3]|length > 120 %}...{% endif %}</div>
            <a href="/blog/{{ blog[0] }}">阅读全文</a>
            <a href="/blog/edit/{{ blog[0] }}" style="margin-left:16px;">编辑</a>
            <form method="post" action="/blog/delete/{{ blog[0] }}" style="display:inline;margin-left:8px;">
                <button type="submit" style="background:#e74c3c;color:#fff;border:none;padding:4px 12px;border-radius:5px;font-weight:bold;cursor:pointer;">删除</button>
            </form>
        </div>
        {% endfor %}
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
