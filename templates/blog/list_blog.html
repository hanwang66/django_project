{% extends 'base/base.html' %}
{% block title %}博客列表{% endblock %}
{% block content %}
<h1>博客列表</h1>
<div style="margin-bottom:16px;">
	<a href="/" style="background:#eee;padding:6px 18px;border-radius:5px;text-decoration:none;color:#333;">返回首页</a>
</div>
<a href="/blog/add/" style="display:inline-block;margin-bottom:18px;">添加博客</a>
<ul>
	{% for blog in blogs %}
	<li style="margin-bottom:24px;">
		<h2><a href="/blog/{{ blog.id }}/">{{ blog.title }}</a></h2>
		<p>作者：{{ blog.author }} | 创建时间：{{ blog.created_at|date:'Y-m-d H:i' }}</p>
	</li>
	{% empty %}
	<li>暂无博客内容。</li>
	{% endfor %}
</ul>
{% endblock %}
