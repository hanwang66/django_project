{% extends 'base/base.html' %}
{% block title %}编辑博客{% endblock %}
{% block content %}
<h1>编辑博客</h1>
<form method="post">{% csrf_token %}
	<label>标题：</label><input type="text" name="title" value="{{ blog.title }}" required><br><br>
	<label>作者：</label><input type="text" name="author" value="{{ blog.author }}" required><br><br>
	<label>内容：</label><br>
	<textarea name="content" rows="8" cols="60" required>{{ blog.content }}</textarea><br><br>
	<button type="submit">保存</button>
</form>
<a href="/blog/{{ blog.id }}/">返回博客详情</a>
{% endblock %}
