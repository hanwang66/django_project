{% extends 'base/base.html' %}
{% block title %}发布博客{% endblock %}
{% block content %}
<h1>添加博客</h1>
<form method="post">{% csrf_token %}
	<label>标题：</label><input type="text" name="title" required><br><br>
	<label>作者：</label><input type="text" name="author" required><br><br>
	<label>内容：</label><br>
	<textarea name="content" rows="8" cols="60" required></textarea><br><br>
	<button type="submit">提交</button>
</form>
<a href="/blog/">返回博客列表</a>
{% endblock %}
