{% extends 'base/base.html' %}
{% block title %}发布博客{% endblock %}
{% block content %}
<h1>添加博客</h1>
<form method="post">{% csrf_token %}
	<label>标题：</label><input type="text" name="title" required><br><br>
	<label>作者：</label><input type="text" name="author" value="{{ user.username }}" readonly style="background:#f5f5f5;color:#888;"><br><br>
	<label>分类：</label>
	<select name="category">
		<option value="">--请选择--</option>
		{% for category in categories %}
		<option value="{{ category.id }}">{{ category.name }}</option>
		{% endfor %}
	</select>
	<a href="/admin/blog/category/add/" target="_blank" style="margin-left:10px;">新建分类</a><br><br>
	<label>标签：</label>
	<select name="tags" multiple size="4">
		{% for tag in tags %}
		<option value="{{ tag.id }}">{{ tag.name }}</option>
		{% endfor %}
	</select>
	<a href="/admin/blog/tag/add/" target="_blank" style="margin-left:10px;">新建标签</a><br><br>
	<label>内容：</label><br>
	<textarea name="content" rows="8" cols="60" required></textarea><br><br>
	<button type="submit">提交</button>
</form>
<a href="/blog/">返回博客列表</a>
{% endblock %}
