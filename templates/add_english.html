<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加英语学习记录</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #27ae60; margin-bottom: 32px; }
        label { display: block; margin: 16px 0 6px; color: #27ae60; }
        input, textarea { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 16px; }
        textarea { min-height: 100px; }
        input[type="submit"] { background: #27ae60; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #2ecc71; }
        a { color: #27ae60; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>添加英语学习记录</h1>
        <form method="post">
            <label for="study_date">日期：</label>
            <input type="date" name="study_date" id="study_date" required>
            <label for="content">学习内容：</label>
            <textarea name="content" id="content" required></textarea>
            <input type="submit" value="保存">
        </form>
        <p><a href="/english/list">查看所有记录</a></p>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
