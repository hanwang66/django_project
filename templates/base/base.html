<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}信息管理系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-full" style="box-shadow:0 2px 16px #e0e0e0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:110px;">
        <div class="navbar-logo" style="font-size:2.6em;font-weight:800;color:#1976d2;display:flex;align-items:center;gap:16px;justify-content:center;margin-bottom:12px;">
            <span style="font-size:2em;">🗂️</span>
            <span>信息管理平台</span>
        </div>
        <div class="navbar-links" style="display:flex;justify-content:center;gap:48px;">
            <a href="/" class="nav-link{% if request.path == '/' %} active{% endif %}" style="display:flex;align-items:center;gap:10px;font-size:1.5em;padding:8px 28px;">
                <span style="font-size:1.3em;">🏠</span> 首页
            </a>
            <a href="/blog/" class="nav-link{% if request.path|slice:":6" == '/blog/' %} active{% endif %}" style="display:flex;align-items:center;gap:10px;font-size:1.5em;padding:8px 28px;">
                <span style="font-size:1.3em;">📝</span> 博客
            </a>
            <a href="/real_estate/" class="nav-link{% if request.path|slice:":12" == '/real_estate/' %} active{% endif %}" style="display:flex;align-items:center;gap:10px;font-size:1.5em;padding:8px 28px;">
                <span style="font-size:1.3em;">🏢</span> 房地产
            </a>
            <a href="/stock/" class="nav-link{% if request.path|slice:":7" == '/stock/' %} active{% endif %}" style="display:flex;align-items:center;gap:10px;font-size:1.5em;padding:8px 28px;">
                <span style="font-size:1.3em;">💹</span> 股票行情
            </a>
        </div>
    </nav>
    <div class="container container-no-top-radius container-no-bottom-radius">
        {% block content %}{% endblock %}
    </div>
        <footer style="margin-top:56px;padding-top:24px;text-align:center;color:#1976d2;font-size:1.25em;font-weight:600;letter-spacing:1px;">
            <hr style="border:none;border-top:2px solid #e3f2fd;margin-bottom:18px;width:60%;margin-left:auto;margin-right:auto;">
            <span style="font-size:1.3em;vertical-align:middle;">🗂️</span>
            © 2025 信息管理平台 &nbsp;|&nbsp; <span style="color:#333;font-weight:500;">Powered by Django</span>
        </footer>
</body>
</html>
