<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发布博客</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 32px; }
        label { display: block; margin: 16px 0 6px; color: #2980b9; }
        input, textarea { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 16px; }
        textarea { min-height: 160px; }
        input[type="submit"] { background: #2980b9; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #3498db; }
        a { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>发布博客</h1>
        <form method="post">
            <label for="title">标题：</label>
            <input type="text" name="title" id="title" required>
            <label for="content">内容：</label>
            <textarea name="content" id="content" required></textarea>
            <input type="submit" value="发布">
        </form>
        <p><a href="/blog/list">查看所有博客</a></p>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
