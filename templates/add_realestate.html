<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>录入房地产信息</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 32px; }
        label { display: block; margin: 16px 0 6px; color: #2980b9; }
        input { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 16px; }
        input[type="submit"] { background: #2980b9; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #3498db; }
        a { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>录入房地产信息</h1>
        <form method="post">
            <label for="community">小区名：</label>
            <input type="text" name="community" id="community" required>
            <label for="city">城市：</label>
            <input type="text" name="city" id="city" required>
            <label for="area">面积（平方米）：</label>
            <input type="number" name="area" id="area" step="0.01" required>
            <label for="floor">楼层：</label>
            <input type="number" name="floor" id="floor" required>
            <label for="total_price">总价（元）：</label>
            <input type="number" name="total_price" id="total_price" step="0.01" required>
            <input type="submit" value="保存">
        </form>
        <p><a href="/realestate/list">查看所有房地产信息</a></p>
        <p><a href="/">返回首页</a></p>
    </div>
</body>
</html>
