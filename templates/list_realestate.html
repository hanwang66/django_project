<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>房地产信息列表</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 32px; }
        form { margin-bottom: 24px; text-align: center; }
        input[type="text"] { width: 220px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        input[type="submit"] { background: #2980b9; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        input[type="submit"]:hover { background: #3498db; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #2980b9; color: #fff; }
        tr:nth-child(even) { background: #f2f6fa; }
        a { color: #2980b9; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>房地产信息列表</h1>
        <form method="post">
            <input type="text" name="query" placeholder="输入小区名或城市进行搜索" value="{{ query }}">
            <input type="submit" value="搜索">
        </form>
        <table>
            <tr>
                <th>ID</th>
                <th>小区名</th>
                <th>城市</th>
                <th>面积(㎡)</th>
                <th>楼层</th>
                <th>总价(元)</th>
            </tr>
            {% for item in results %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>{{ item[4] }}</td>
                <td>{{ item[5] }}</td>
            </tr>
            {% endfor %}
        </table>
        <div style="margin-bottom:16px;">
            <a href="/realestate/export/excel" style="background:#27ae60;color:#fff;padding:8px 16px;border-radius:5px;text-decoration:none;margin-right:10px;">导出为Excel</a>
            <a href="/realestate/export/pdf" style="background:#e67e22;color:#fff;padding:8px 16px;border-radius:5px;text-decoration:none;margin-right:10px;">导出为PDF</a>
            <a href="javascript:void(0);" onclick="shareRealEstate()" style="background:#2980b9;color:#fff;padding:8px 16px;border-radius:5px;text-decoration:none;">一键分享</a>
        </div>
        <p><a href="/realestate/add">录入新房地产信息</a></p>
        <p><a href="/">返回首页</a></p>
        <script>
        function shareRealEstate() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(function() {
                alert('分享链接已复制到剪贴板！');
            }, function(err) {
                alert('复制失败，请手动复制链接。');
            });
        }
        </script>
    </div>
</body>
</html>
