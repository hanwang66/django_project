{% extends 'base/base.html' %}
{% block title %}编辑信息{% endblock %}
{% block content %}
<h1>编辑信息</h1>
<form method="post">{% csrf_token %}
	<label>姓名：</label><input type="text" name="name" value="{{ info.name }}" required><br><br>
	<label>邮箱：</label><input type="email" name="email" value="{{ info.email }}" required><br><br>
	<label>留言：</label><br>
	<textarea name="message" rows="6" cols="60" required>{{ info.message }}</textarea><br><br>
	<button type="submit">保存</button>
</form>
<a href="/info/{{ info.id }}/">返回信息详情</a>
{% endblock %}
