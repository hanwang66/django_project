{% extends 'base/base.html' %}
{% block title %}添加信息{% endblock %}
{% block content %}
<h1>添加信息</h1>
<form method="post">{% csrf_token %}
	<label>姓名：</label><input type="text" name="name" required><br><br>
	<label>邮箱：</label><input type="email" name="email" required><br><br>
	<label>留言：</label><br>
	<textarea name="message" rows="6" cols="60" required></textarea><br><br>
	<button type="submit">提交</button>
</form>
<a href="/info/">返回信息列表</a>
{% endblock %}
