# nginx-deployment-hostpath.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hostpath
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # 如果你是在 master 节点运行（且 master 有 NoSchedule 污点），需添加容忍
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: docker.io/library/nginx:latest
          imagePullPolicy: Never      # 关键：只用本地
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-data
              mountPath: /usr/share/nginx/html  # 容器内路径
      volumes:
        - name: nginx-data
          hostPath:
            path: /mnt/nginx-data  # 主机上的绝对路径
            type: Directory        # 可选值：Directory, File, etc.
---
# （可选）暴露服务
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080  # 访问 http://<NODE_IP>:30080
  selector:
    app: nginx